services:
  - type: web
    name: neesh-fragrance-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 90 app:app
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_ACCESS_CODE
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
